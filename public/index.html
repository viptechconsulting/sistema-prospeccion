<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lynkro — Copiloto Comercial</title>
<link rel="stylesheet" href="/app.css"/>
</head>
<body>
<header>
  <h1>Lynkro — Copiloto Comercial</h1>
  <nav>
    <button data-view="kanban" class="active">Kanban</button>
    <button data-view="table">Tabla</button>
    <button data-view="campaigns">Campañas</button>
    <button data-view="settings">Settings</button>
    <button id="btn-new" class="primary">+ Nueva campaña</button>
  </nav>
</header>

<section id="metrics" class="metrics"></section>

<section id="filters" class="filters">
  <select id="f-campaign"><option value="">Todas las campañas</option></select>
  <select id="f-platform"><option value="">Todas las plataformas</option><option value="google_maps">Google Maps</option><option value="linkedin">LinkedIn</option><option value="instagram">Instagram</option><option value="meta_ads">Meta Ads</option><option value="google_serp">Google SERP</option></select>
  <select id="f-status"><option value="">Todos los estados</option><option value="nuevo">Nuevo</option><option value="analizado">Analizado</option><option value="estrategia_lista">Estrategia lista</option><option value="mensaje_listo">Mensaje listo</option><option value="contactado">Contactado</option><option value="respondio">Respondió</option><option value="interesado">Interesado</option><option value="objecion">Objeción</option><option value="demo_propuesta">Demo propuesta</option><option value="demo_agendada">Demo agendada</option><option value="propuesta_enviada">Propuesta enviada</option><option value="cerrado_ganado">Cerrado ganado</option><option value="cerrado_perdido">Cerrado perdido</option><option value="reactivar_despues">Reactivar después</option></select>
  <input id="f-score" type="number" min="1" max="10" placeholder="Score min"/>
  <select id="f-web"><option value="">Web: todos</option><option value="yes">Con web</option><option value="no">Sin web</option></select>
  <button id="btn-score">Analizar pendientes</button>
  <button id="btn-export">⬇ Exportar CSV</button>
  <button id="btn-refresh">↻</button>
</section>

<main id="view-kanban" class="view active">
  <div class="kanban" id="kanban-board"></div>
</main>

<main id="view-table" class="view">
  <table class="leads">
    <thead><tr><th>Nombre</th><th>Empresa</th><th>Plataforma</th><th>Score</th><th>Estado</th><th>Contactado</th><th>Mensaje</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
</main>

<main id="view-campaigns" class="view">
  <table class="leads"><thead><tr><th>Nombre / Nicho</th><th>Plataforma</th><th>Ubicación</th><th>Servicio</th><th>Leads</th><th>Status</th><th>Creada</th><th></th></tr></thead><tbody id="campaigns-tbody"></tbody></table>
</main>

<main id="view-settings" class="view">
  <form id="settings-form" class="settings"></form>
</main>

<!-- New campaign modal -->
<div id="modal-campaign" class="modal hidden">
  <form class="card">
    <h2>Nueva campaña</h2>
    <div id="prompt-section" style="border:1px solid #333;border-radius:8px;padding:12px;margin-bottom:16px;background:#1a1a2e">
      <label style="color:#00ff88;font-weight:600;font-size:13px">Búsqueda inteligente<textarea id="campaign-prompt" rows="3" placeholder="Ej: Búscame 20 dentistas en San Juan, Puerto Rico con su teléfono, dirección y calificación en Google Maps" style="margin-top:6px"></textarea></label>
      <button type="button" id="btn-parse-prompt" class="primary" style="margin-top:8px;width:100%">Analizar búsqueda</button>
      <div id="prompt-status" style="font-size:11px;color:#888;margin-top:6px"></div>
    </div>
    <div id="manual-fields">
      <label>Plataforma<select name="platform" required><option value="google_maps">Google Maps</option><option value="linkedin">LinkedIn</option><option value="instagram">Instagram</option><option value="meta_ads">Meta Ads Library</option><option value="google_serp">Google SERP (pos 15+)</option></select></label>
      <label>Nicho<input name="niche" placeholder="dentistas, spas, agencias..." required/></label>
      <label>Ubicación <span style="color:#888;font-size:11px">(varias ciudades separadas por coma)</span><input name="location" placeholder="Miami FL, Orlando FL, Tampa FL"/></label>
      <label>Palabras clave<input name="keywords" placeholder="opcional"/></label>
      <label>Idioma del mensaje<select name="language"><option value="auto">Auto-detectar</option><option value="es">Español</option><option value="en">Inglés</option></select></label>
      <label>Servicio ofrecido
        <div class="preset-wrap"><select class="preset-select" data-target="serviceOffered"><option value="">-- Seleccionar guardado --</option></select><button type="button" class="btn-add-preset" data-field="serviceOffered" title="Guardar actual">+</button></div>
        <input name="serviceOffered" placeholder="Ej: automatizaciones con IA para seguimiento de clientes"/>
      </label>
      <label>Beneficio principal
        <div class="preset-wrap"><select class="preset-select" data-target="mainBenefit"><option value="">-- Seleccionar guardado --</option></select><button type="button" class="btn-add-preset" data-field="mainBenefit" title="Guardar actual">+</button></div>
        <input name="mainBenefit" placeholder="Ej: ahorra 5 horas semanales en tareas repetitivas"/>
      </label>
      <label>Diferencial clave
        <div class="preset-wrap"><select class="preset-select" data-target="keyDifferential"><option value="">-- Seleccionar guardado --</option></select><button type="button" class="btn-add-preset" data-field="keyDifferential" title="Guardar actual">+</button></div>
        <input name="keyDifferential" placeholder="Ej: implementación en menos de 2 semanas, sin código"/>
      </label>
      <label>SERP desde posición (solo Google SERP)<input name="serpStartPosition" type="number" value="15" min="1" max="90"/></label>
      <label>Máx leads<input name="maxLeads" type="number" value="25" min="1" max="500"/></label>
    </div>
    <div class="row">
      <button type="button" class="cancel">Cancelar</button>
      <button type="submit" class="primary">Lanzar</button>
    </div>
  </form>
</div>

<!-- Lead detail modal -->
<div id="modal-lead" class="modal hidden">
  <div class="card lead-detail"></div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
