<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lynkro — Acceso</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0f0f0f;
  color: #fff;
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-wrap {
  width: 100%;
  max-width: 380px;
}
.login-header {
  text-align: center;
  margin-bottom: 36px;
}
.login-header .logo {
  font-size: 26px;
  font-weight: 800;
  color: #00ff88;
  letter-spacing: -0.5px;
}
.login-header .tagline {
  font-size: 13px;
  color: #555;
  margin-top: 6px;
}
.login-card {
  background: #151515;
  border: 1px solid #2a2a2a;
  border-radius: 12px;
  padding: 32px 28px;
}
.login-card h2 {
  font-size: 17px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 24px;
}
.field {
  margin-bottom: 18px;
}
.field label {
  display: block;
  font-size: 12px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.input-wrap {
  position: relative;
}
.input-wrap input {
  width: 100%;
  background: #0f0f0f;
  color: #fff;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  padding: 11px 14px;
  font-size: 14px;
  font-family: inherit;
  transition: border-color 0.15s;
  outline: none;
}
.input-wrap input:focus {
  border-color: #00ff88;
}
.input-wrap input.has-toggle {
  padding-right: 44px;
}
.toggle-pass {
  position: absolute;
  right: 0;
  top: 0;
  height: 100%;
  width: 42px;
  background: none;
  border: none;
  color: #555;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: color 0.15s;
  padding: 0;
}
.toggle-pass:hover { color: #00ff88; }
.btn-login {
  width: 100%;
  background: #00ff88;
  color: #0f0f0f;
  border: none;
  border-radius: 8px;
  padding: 13px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  margin-top: 8px;
  font-family: inherit;
}
.btn-login:hover { opacity: 0.9; }
.btn-login:active { transform: scale(0.98); }
.btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
.error-msg {
  display: none;
  background: #2a0f0f;
  border: 1px solid #552222;
  color: #ff6666;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 16px;
}
.error-msg.visible { display: block; }
.login-footer {
  text-align: center;
  margin-top: 24px;
  font-size: 11px;
  color: #333;
}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-header">
    <div class="logo">Lynkro</div>
    <div class="tagline">Copiloto comercial para negocios locales</div>
  </div>

  <div class="login-card">
    <h2>Iniciar sesión</h2>
    <div class="error-msg" id="error-msg">Usuario o contraseña incorrectos.</div>

    <form id="login-form" autocomplete="on">
      <div class="field">
        <label>Usuario</label>
        <div class="input-wrap">
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            placeholder="Tu usuario"
            autofocus
          />
        </div>
      </div>

      <div class="field">
        <label>Contraseña</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="Tu contraseña"
            class="has-toggle"
          />
          <button type="button" class="toggle-pass" id="toggle-pass" title="Mostrar/ocultar contraseña">
            <svg id="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btn-login">Entrar</button>
    </form>
  </div>

  <div class="login-footer">Acceso restringido · Solo usuarios autorizados</div>
</div>

<script>
const toggleBtn = document.getElementById('toggle-pass');
const passInput = document.getElementById('password');
const iconEye = document.getElementById('icon-eye');
const iconEyeOff = document.getElementById('icon-eye-off');

toggleBtn.addEventListener('click', () => {
  const isPassword = passInput.type === 'password';
  passInput.type = isPassword ? 'text' : 'password';
  iconEye.style.display = isPassword ? 'none' : 'block';
  iconEyeOff.style.display = isPassword ? 'block' : 'none';
  passInput.focus();
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const errorMsg = document.getElementById('error-msg');
  const username = document.getElementById('username').value.trim();
  const password = passInput.value;

  if (!username || !password) {
    errorMsg.textContent = 'Completa todos los campos.';
    errorMsg.classList.add('visible');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Verificando…';
  errorMsg.classList.remove('visible');

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    if (res.ok) {
      window.location.href = '/';
    } else {
      errorMsg.textContent = 'Usuario o contraseña incorrectos.';
      errorMsg.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      passInput.focus();
    }
  } catch {
    errorMsg.textContent = 'Error de conexión. Intenta de nuevo.';
    errorMsg.classList.add('visible');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
